name: CMake on Windows

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: false

    env:
      BUILD_TYPE: Release
      CC: cl
      CXX: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/_build"

    - name: Generate project
      run: >
        ./generate_project_vs2022.bat

    - name: Build
      run: |
        cd _build
        cmake --build . --target unittests --config ${{ env.BUILD_TYPE }}
